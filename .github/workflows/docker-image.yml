name: Docker Image CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      run: pip install uv

    - name: Install ruff
      run: uv tool install ruff

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with ruff
      run: ruff format --check .

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub (optional)
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        cd docker
        docker build -t tradingagents:${{ github.sha }} .
        docker build -t tradingagents:latest .

    - name: Test Docker image
      run: |
        docker run --rm tradingagents:${{ github.sha }} uv run python -c "from graph.trading_graph import TradingAgentsGraph; print('Import successful')"

    - name: Push Docker image (optional)
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        docker tag tradingagents:latest ${{ secrets.DOCKER_USERNAME }}/tradingagents:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/tradingagents:latest
