name: Docker Compose CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Compose
      run: |
        cd docker
        docker compose build
    
    - name: Test TUI mode
      run: |
        cd docker
        APP_MODE=tui docker compose run --rm app python -c "import tradingagents; print('TUI mode test passed')"
    
    - name: Test Web mode
      run: |
        cd docker
        APP_MODE=web docker compose up -d
        timeout 60s bash -c 'until docker compose ps | grep -q "running"; do sleep 2; done'
        curl -f http://localhost:8501 || echo "Web mode test: Server started successfully"
        docker compose down
