line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
preview = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
select = ["ALL"]
ignore = [
    "D",
    "ANN",
    "ERA001",
    "COM812",
    "ISC001",
    "CPY001",
]
unfixable = [
    "F401",
]
