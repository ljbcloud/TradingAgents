[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "tradingagents"
version = "0.2.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0",
    "langchain-core>=0.3.81",
    "chainlit>=2.5.5",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=2.1.5",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "stockstats>=0.6.5",
    "textual>=0.47.0",
    "typer>=0.21.0",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.2.2",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "bandit>=1.7.0",
    "mypy>=1.0.0",
]
radon = [
    "ib_insync>=0.9.86",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
]
radon-full = [
    "tradingagents[radon]",
    "playwright>=1.40.0",
]
api = [
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.25.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/dataflows", "src/graph", "src/llm_clients", "src/radon", "src/cli", "src/api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
targets = ["src"]
skips = ["B101", "B601", "B110"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "var-annotated",
    "union-attr",
    "return-value",
    "import-untyped",
    "misc",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",  # shadowing builtins
    "ARG001",  # unused function arguments
    "ARG002",  # unused method arguments
    "D",  # docstyle
    "ANN",  # annotations
    "DOC",  # docstring conventions
    "ERA001",  # commented out code
    "COM812",  # missing trailing comma
    "ISC001",  # single line implicit string concatenation
    "CPY001",  # missing copyright notice
    "DTZ005",  # naive datetime.now
    "DTZ007",  # naive datetime.strptime
    "DTZ011",  # datetime.date.today used
    "E501",  # line too long
    "PTH118",  # os.path.join should use Path
    "TRY002",  # create your own exception
    "TRY004",  # prefer TypeError
    "TRY300",  # move to else block
    "B904",  # raise from in except
    "FBT002",  # boolean default argument
    "N802",  # function name should be lowercase
    "PLR0911",  # too many return statements
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
    "PLR2004",  # magic value in comparison
    "PLW0603",  # global statement discouraged
    "PLC0415",  # import at top-level
    "PLC1901",  # can be simplified
    "PD011",  # use .to_numpy()
    "S110",  # try-except-pass
    "C901",  # function too complex
    "PLR0912",  # too many branches
    "PLR0914",  # too many local variables
    "PLR0915",  # too many statements
    "PLR1702",  # too many nested blocks
    "PLR6301",  # method could be function
    "RUF012",  # mutable class attributes
    "SLF001",  # private member access
    "BLE001",  # blind exception
    "F403",  # star imports (used in graph setup)
    "F405",  # undefined names from star imports
]
unfixable = [
    "F401",
]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["PD901"]
"src/agents/utils/agent_utils.py" = ["F401"]
"src/dataflows/alpha_vantage.py" = ["F401"]
"src/dataflows/ccxt_crypto.py" = ["DTZ006", "PERF401"]
"src/cli/**/*.py" = ["PD901"]
"tests/**/*.py" = ["S101"]
"tests/radon/**/*.py" = [
    "E402",     # module level import not at top (section-based imports)
    "FBT003",   # boolean positional value in @patch() calls
    "PLR0904",  # too many public methods in test classes
    "PLC2701",  # private name import for testing internals
    "PT012",    # pytest.raises with multi-statement body
    "S105",     # hardcoded password in test fixtures
    "S106",     # hardcoded password argument in test fixtures
]
"tests/dataflows/test_ccxt_common.py" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=agents",
    "--cov=dataflows",
    "--cov=graph",
    "--cov=llm_clients",
    "--cov=radon",
    "--cov=cli",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests",
    "slow: Slow-running tests",
    "llm: Tests requiring LLM interaction",
    "asyncio: Async tests using pytest-asyncio",
]
