[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingagents"
version = "0.2.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "chainlit>=2.5.5",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.5",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "bandit>=1.7.0",
    "mypy>=1.0.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["tradingagents", "cli"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601", "B110"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "var-annotated",
    "union-attr",
    "return-value",
    "import-untyped",
    "misc",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",  # shadowing builtins
    "ARG001",  # unused function arguments
    "ARG002",  # unused method arguments
    "D",  # docstyle
    "ANN",  # annotations
    "DOC",  # docstring conventions
    "ERA001",  # commented out code
    "COM812",  # missing trailing comma
    "ISC001",  # single line implicit string concatenation
    "CPY001",  # missing copyright notice
    "DTZ005",  # naive datetime.now
    "DTZ007",  # naive datetime.strptime
    "DTZ011",  # datetime.date.today used
    "E501",  # line too long
    "PTH118",  # os.path.join should use Path
    "TRY002",  # create your own exception
    "TRY004",  # prefer TypeError
    "TRY300",  # move to else block
    "B904",  # raise from in except
    "FBT002",  # boolean default argument
    "N802",  # function name should be lowercase
    "PLR0911",  # too many return statements
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
    "PLR2004",  # magic value in comparison
    "PLW0603",  # global statement discouraged
    "PLC0415",  # import at top-level
    "PLC1901",  # can be simplified
    "PD011",  # use .to_numpy()
    "S110",  # try-except-pass
    "C901",  # function too complex
    "PLR0912",  # too many branches
    "PLR0914",  # too many local variables
    "PLR0915",  # too many statements
    "PLR1702",  # too many nested blocks
    "PLR6301",  # method could be function
    "RUF012",  # mutable class attributes
    "SLF001",  # private member access
    "BLE001",  # blind exception
    "F403",  # star imports (used in graph setup)
    "F405",  # undefined names from star imports
]
unfixable = [
    "F401",
]

[tool.ruff.lint.per-file-ignores]
"tradingagents/**/*.py" = ["PD901"]
"tradingagents/agents/utils/agent_utils.py" = ["F401"]
"tradingagents/dataflows/alpha_vantage.py" = ["F401"]
"cli/**/*.py" = ["PD901"]
